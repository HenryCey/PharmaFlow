<header class="h-16 shrink-0 bg-white border-b border-slate-200 flex items-center justify-between px-6">
    <div class="flex items-center gap-4">
        <button @click="sidebarOpen = !sidebarOpen" class="text-slate-500 hover:text-slate-800" aria-label="Toggle sidebar">
            &#9776;
        </button>
        <div>
            <h1 class="text-base font-semibold text-slate-900">{% block page_title %}Dashboard{% endblock %}</h1>
            {% block breadcrumb %}{% endblock %}
        </div>
    </div>

    <div class="flex items-center gap-4">
        <form method="get" action="#" class="hidden md:block">
            <input
                type="search" name="q" placeholder="Search PharmaFlow..."
                class="w-72 rounded-md border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
            >
        </form>

        <button class="relative text-slate-500 hover:text-slate-800" aria-label="Notifications" title="Notifications">
            &#128276;
        </button>

        <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="flex items-center gap-2" aria-haspopup="true" :aria-expanded="open">
                <div class="h-8 w-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-medium">
                    {{ request.user.get_short_name|default:"?"|first|upper }}
                </div>
                <div class="text-sm text-left">
                    <p class="font-medium leading-4">{{ request.user.get_full_name }}</p>
                    <p class="text-slate-500 text-xs leading-4">{{ request.user.role.name|default:"No role" }}</p>
                </div>
            </button>
            <div x-show="open" @click.outside="open = false" x-cloak
                 class="absolute right-0 mt-2 w-48 rounded-md bg-white shadow-lg border border-slate-200 z-20">
                <a href="{% url 'accounts:password_change' %}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
                    Change Password
                </a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

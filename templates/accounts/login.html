{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — PharmaFlow</title>
    {% include "layout/partials/_tailwind_cdn.html" %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="h-full flex items-center justify-center">
    <div class="w-full max-w-sm bg-white rounded-lg shadow-md border border-slate-200 p-8">
        <h1 class="text-xl font-semibold text-slate-900 mb-1">PharmaFlow</h1>
        <p class="text-sm text-slate-500 mb-6">Sign in to continue</p>

        {% if form.non_field_errors %}
            <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">
                {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
            </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1" for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-1" for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="w-full rounded-md bg-primary text-white py-2 text-sm font-medium hover:bg-primary-dark">
                Log in
            </button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</body>
</html>

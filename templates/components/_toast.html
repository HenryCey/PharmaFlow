{% if messages %}
<div class="fixed top-4 right-4 z-50 space-y-2" x-data="{ shown: true }" x-show="shown" x-init="setTimeout(() => shown = false, 5000)">
    {% for message in messages %}
        <div class="rounded-md shadow-md px-4 py-3 text-sm text-white
            {% if message.tags == 'success' %}bg-success
            {% elif message.tags == 'warning' %}bg-warning
            {% elif message.tags == 'error' %}bg-danger
            {% else %}bg-slate-700{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

{% comment %}
Usage: {% include "components/_input.html" with field=form.username helper="Used to log in." %}
{% endcomment %}
<div class="mb-4">
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">
        {{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}
    </label>
    {{ field }}
    {% if helper %}<p class="mt-1 text-xs text-slate-500">{{ helper }}</p>{% endif %}
    {% for error in field.errors %}
        <p class="mt-1 text-xs text-danger">{{ error }}</p>
    {% endfor %}
</div>
